name: Build v2.2.0 release package

on:
  push:
    branches:
      - release/v2.2.0

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    env:
      PACKAGE_NAME: probg-stickers-2.2.0.ocmod.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/probg-stickers-release
          zip -r "/tmp/probg-stickers-release/${PACKAGE_NAME}" install.xml upload             -x '*.DS_Store' -x '__MACOSX/*'

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "/tmp/probg-stickers-release/${PACKAGE_NAME}"

          python3 - <<'PY'
          import zipfile

          package = "/tmp/probg-stickers-release/probg-stickers-2.2.0.ocmod.zip"

          with zipfile.ZipFile(package) as archive:
              names = archive.namelist()

          assert "install.xml" in names, "install.xml missing from archive root"
          assert any(name.startswith("upload/") for name in names), "upload/ missing from archive root"
          assert not any(name.startswith("dist/") for name in names), "dist/ must not be inside package"
          assert not any(name.startswith("probg-stickers") and "/" in name for name in names), "wrapper directory detected"

          print(f"Validated {len(names)} archive entries")
          PY

          cd /tmp/probg-stickers-release
          sha256sum "${PACKAGE_NAME}" > "${PACKAGE_NAME}.sha256"

      - name: Add release package to dist
        shell: bash
        run: |
          set -euo pipefail
          cp "/tmp/probg-stickers-release/${PACKAGE_NAME}" "dist/${PACKAGE_NAME}"
          sha256sum dist/*.ocmod.zip | sed 's#dist/##' > dist/SHA256SUMS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f "dist/${PACKAGE_NAME}"
          git add dist/SHA256SUMS

          if git diff --cached --quiet; then
            echo "No release artifact changes."
          else
            git commit -m "chore: add v2.2.0 install package"
            git push origin HEAD:release/v2.2.0
          fi
