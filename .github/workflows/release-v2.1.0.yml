name: Build and publish v2.1.0

on:
  push:
    branches:
      - chore/release-v2.1.0

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: v2.1.0
      RELEASE_VERSION: 2.1.0
      PACKAGE_NAME: probg-stickers-2.1.0.ocmod.zip

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Build OpenCart install package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/probg-stickers-release
          mkdir -p /tmp/probg-stickers-release

          zip -r "/tmp/probg-stickers-release/${PACKAGE_NAME}" install.xml upload             -x '*.DS_Store' -x '__MACOSX/*'

          cd /tmp/probg-stickers-release
          sha256sum "${PACKAGE_NAME}" > SHA256SUMS

      - name: Validate package structure
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "/tmp/probg-stickers-release/${PACKAGE_NAME}"

          python3 - <<'PY'
          import zipfile

          package = "/tmp/probg-stickers-release/probg-stickers-2.1.0.ocmod.zip"

          with zipfile.ZipFile(package) as archive:
              names = archive.namelist()

          assert "install.xml" in names, "install.xml is missing from archive root"
          assert any(name.startswith("upload/") for name in names), "upload/ is missing from archive root"
          assert not any(name.startswith("probg-stickers") and "/" in name for name in names), "wrapper directory detected"
          assert not any(name.startswith("dist/") for name in names), "dist/ must not be inside install package"

          print(f"Validated {len(names)} archive entries")
          PY

      - name: Prepare release notes
        shell: bash
        run: |
          cat > /tmp/probg-stickers-release/RELEASE_NOTES.md <<'EOF'
          ## Български

          ### ProBG Product Stickers v2.1.0

          Версия 2.1.0 добавя автоматизирани продуктови стикери и завършва интеграцията на модула със стандартната OpenCart 3 тема.

          **Нови възможности**
          - автоматичен стикер **„Нов“** с настройка за брой дни след `date_added`;
          - автоматичен стикер **„Промоция“** за активна `product_special` цена;
          - опция за показване на процента намаление, например **„Промоция -20%“**;
          - защитени системни стикери, които могат да се активират/деактивират, но не могат да бъдат изтривани;
          - автоматично извеждане в стандартната OpenCart 3 продуктова страница, related products, категории, търсене, производители, промоции и стандартните продуктови модули;
          - автоматично зареждане на stylesheet файла.

          **Подобрения**
          - upgrade-safe миграция към InnoDB + utf8mb4;
          - допълнителни индекси на mapping таблиците;
          - коригирани BG/EN преводи и Twig/CSS интеграция;
          - оптимизирани storefront заявки;
          - добавени автоматични проверки за PHP 7.2, 7.4 и 8.1.

          Проверена съвместимост на OCMOD anchor-ите с OpenCart 3.0.2.0, 3.0.3.7 и 3.0.3.9.

          ---

          ## English

          ### ProBG Product Stickers v2.1.0

          Version 2.1.0 adds automated product stickers and completes the integration with the default OpenCart 3 theme.

          **New**
          - automatic **New** sticker with configurable days after `date_added`;
          - automatic **Sale** sticker for active `product_special` prices;
          - optional calculated discount percentage, e.g. **Sale -20%**;
          - protected system stickers that can be enabled/disabled but not deleted;
          - automatic rendering on the default OpenCart 3 product page, related products, category/search/manufacturer/special lists and standard product modules;
          - automatic stylesheet loading.

          **Improvements**
          - upgrade-safe migration to InnoDB + utf8mb4;
          - additional mapping-table indexes;
          - corrected BG/EN translations and Twig/CSS integration;
          - optimized storefront queries;
          - automated validation on PHP 7.2, 7.4 and 8.1.

          OCMOD anchors were checked against OpenCart 3.0.2.0, 3.0.3.7 and 3.0.3.9.
          EOF

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}"               --title "ProBG Product Stickers v${RELEASE_VERSION}"               --notes-file /tmp/probg-stickers-release/RELEASE_NOTES.md

            gh release upload "${RELEASE_TAG}"               "/tmp/probg-stickers-release/${PACKAGE_NAME}"               /tmp/probg-stickers-release/SHA256SUMS               --clobber
          else
            gh release create "${RELEASE_TAG}"               "/tmp/probg-stickers-release/${PACKAGE_NAME}"               /tmp/probg-stickers-release/SHA256SUMS               --verify-tag               --title "ProBG Product Stickers v${RELEASE_VERSION}"               --notes-file /tmp/probg-stickers-release/RELEASE_NOTES.md
          fi

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: chore/release-v2.1.0
          fetch-depth: 0

      - name: Add package to dist
        shell: bash
        run: |
          set -euo pipefail
          cp "/tmp/probg-stickers-release/${PACKAGE_NAME}" "dist/${PACKAGE_NAME}"
          sha256sum dist/*.ocmod.zip | sed 's#dist/##' > dist/SHA256SUMS

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "dist/${PACKAGE_NAME}" dist/SHA256SUMS

          if git diff --cached --quiet; then
            echo "No dist changes to commit."
          else
            git commit -m "chore: add v${RELEASE_VERSION} install package"
            git push origin HEAD:chore/release-v2.1.0
          fi
